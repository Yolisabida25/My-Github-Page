<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Bootstrap CSS --> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 

    <link rel="stylesheet" href="styles.css"> 
</head>

<body>

<header>
    <h1>ShadeHub</h1>
    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="gallery.html">Gallery</a> |
        <a href="contact.html">Contact</a> |
        <a href="order.html">Order</a>
    </nav>
</header>

<main>
<section class="order-box">
    <h2>Place Your Order</h2>
    <p>Complete the form below to order your favourite ShadeHub sunglasses.</p>

    <form>
        <label>Full Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone" required><br><br>

        <label>Select Sunglasses:</label><br>
        <select name="product">
            <option>Classic Black - P150</option>
            <option>Gold Frame - P200</option>
            <option>Luxury Shades - P250</option>
            <option>Rose Gold Frames - P240</option>
            <option>Ocean Blue Shades - P200</option>
            <option>Retro Vintage - P170</option>
            <option>Summer Clear Glasses - P160</option>
            <option>Matte Grey Shades - P210</option>
            <option>Celebrity Edition - P300</option>
            <option>Oversized Fashion Shades - P260</option>
            <option>Classic Brown Frames - P190</option>  
        </select><br><br>

        <label>Quantity:</label><br>
        <input type="number" min="1" value="1"><br><br>

        <label>Delivery Address:</label><br>
        <textarea name="address"></textarea><br><br>

        <button type="submit" class="btn-pink">Submit Order</button>
    </form>
</section>
</main>

    <footer>
    <p>&copy;2026 ShadeHub</p>
       
    </footer>
